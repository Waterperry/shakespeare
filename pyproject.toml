[project]
name = "shakespeare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "basedpyright>=1.39.5",
    "datasets>=4.8.5",
    "dvc>=3.67.1",
    "fire>=0.7.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "protobuf>=7.34.1",
    "rich>=15.0.0",
    "sentencepiece>=0.2.1",
    "tensorboard>=2.20.0",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.8.0",
]

[ tool.setuptools ]
py-modules = ["shakespeare"]

[ tool.basedpyright ]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
